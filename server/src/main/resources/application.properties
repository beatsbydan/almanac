spring.application.name=server

# DATABASE
spring.datasource.url=jdbc:postgresql://${DB_URL}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database=postgresql
spring.jpa.hibernate-ddl-auto=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ENV
spring.config.import=optional:file:.env[.properties]

# SHEDLOCK
spring.shedlock.table=shedlock
spring.shedlock.enable=true

# LIQUIBASE
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/migrations/changelog-master.xml

# FILE
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# SECRET-KEY
project.security.secret-key=${SECRET_KEY}

# TOKEN-EXPIRATION-DETAILS
project.security.access-token.expiration=600000
project.security.reset-token.expiration=900000
project.security.refresh-token.expiration=1800000

# MAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=danielonyeachonam2020@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CRON
project.generation.cron.exp=* */2 * * * *
project.cron.min.lock=PT5M
project.cron.max.lock=PT10M
project.scheduler.thread.count=10

# REDIS
project.redis.address=${REDIS_ADDRESS}

# GENERATION ENGINE
project.generation-engine.url=${GENERATION_ENGINE_URL:http://localhost:8000}