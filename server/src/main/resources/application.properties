spring.application.name=server

# LOGGING
# tenant=... comes from TenantContext (configs/tenant/TenantContext.java), mirrored into SLF4J's
# MDC — without it, nothing in a log line says which tenant's request produced it.
logging.pattern.console=%clr(%d{${LOG_DATEFORMAT_PATTERN:-yyyy-MM-dd'T'HH:mm:ss.SSSXXX}}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([tenant=%X{tenantId:-none}]){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}

# DATABASE
spring.datasource.url=jdbc:postgresql://${DB_URL}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database=postgresql
spring.jpa.hibernate-ddl-auto=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ENV
spring.config.import=optional:file:.env[.properties]

# SHEDLOCK
spring.shedlock.table=shedlock
spring.shedlock.enable=true

# LIQUIBASE
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/migrations/changelog-master.xml

# FILE
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# SECRET-KEY
project.security.secret-key=${SECRET_KEY}

# TOKEN-EXPIRATION-DETAILS
project.security.access-token.expiration=600000
project.security.reset-token.expiration=900000
project.security.refresh-token.expiration=1800000

# MAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=danielonyeachonam2020@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CRON
project.generation.cron.exp=* */2 * * * *
project.cron.min.lock=PT5M
project.cron.max.lock=PT10M
project.scheduler.thread.count=10

# REDIS
project.redis.address=${REDIS_ADDRESS}

# GENERATION ENGINE
project.generation-engine.url=${GENERATION_ENGINE_URL:http://localhost:8000}

# DOCUMENT STORAGE
project.document-storage.type=${DOCUMENT_STORAGE_TYPE:local}
project.document-storage.local.directory=${DOCUMENT_STORAGE_DIR:${user.dir}/documents}
project.document-storage.remote.endpoint=${DOCUMENT_STORAGE_REMOTE_ENDPOINT:}
project.document-storage.remote.region=${DOCUMENT_STORAGE_REMOTE_REGION:us-east-1}
project.document-storage.remote.access-key=${DOCUMENT_STORAGE_REMOTE_ACCESS_KEY:}
project.document-storage.remote.secret-key=${DOCUMENT_STORAGE_REMOTE_SECRET_KEY:}
project.document-storage.remote.bucket=${DOCUMENT_STORAGE_REMOTE_BUCKET:almanac-documents}